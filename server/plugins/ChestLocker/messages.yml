# All chat messages sent by ChestLocker. Edit these to translate the
# plugin into another language. Color codes use '&' (e.g. &c = red).
#
# "prefix" is applied in front of every single message below and is kept
# separate on purpose: you can freely recolor individual messages without
# changing how the "[ChestLocker]" tag itself looks - it will always look
# the same no matter what color the rest of the message is.
prefix: '&b[&bChestLocker&8] '

# --- Permissions ---
no-permission-use: '&cYou don''t have permission to use ChestLocker.'
no-permission-command: '&cYou don''t have permission to do that.'

# --- /cl command ---
player-not-found: '&cPlayer not found: {player}'
console-must-specify-player: '&cConsole must specify a player: /cl give <player>'
key-received: '&aYou received a Chest Key.'
key-given-to: '&aGave a Chest Key to {player}.'
bypass-players-only: '&cOnly players can use bypass mode.'
bypass-enabled: '&eBypass mode &aENABLED&e. You can now open/break locked chests without their PIN.'
bypass-disabled: '&eBypass mode &cDISABLED&e.'
config-reloaded: '&aConfig and messages reloaded.'
usage-header: '&6ChestLocker commands:'
usage-give: '&e/cl give [player] &7- give a Chest Key'
usage-bypass: '&e/cl bypass &7- toggle PIN bypass mode'
usage-reload: '&e/cl reload &7- reload config.yml and messages.yml'

# --- Locking / chest interaction ---
max-locks-reached: '&cYou reached the maximum number of locked chests ({max}).'
enter-pin-destroy: '&6Enter the PIN to destroy this chest.'
chest-protected: '&cThis chest is PIN-locked and cannot be broken. Shift + Left-Click it and enter the PIN to destroy it properly.'
key-no-place: '&cThe Chest Key cannot be placed as a block.'

# --- PIN pad GUI ---
pin-cancelled: '&7Cancelled.'
pin-wrong: '&cWrong PIN, try again.'
chest-gone: '&cThe chest seems to be gone.'
pin-set: '&aPIN set! The key was consumed. Remember the PIN - you will need it to open or destroy this chest.'
pin-correct-open: '&aCorrect PIN, opening chest.'
destroy-cancelled: '&7Destruction cancelled.'
chest-destroyed: '&eChest destroyed.'
pin-change-prompt: '&6Enter the current PIN to change it.'
pin-changed: '&aPIN changed successfully!'

# --- PIN attempt cooldown ---
pin-cooldown-active: '&cToo many wrong attempts. Try again in {time}.'
pin-cooldown-triggered: '&cToo many wrong attempts! You are locked out for {time}.'
